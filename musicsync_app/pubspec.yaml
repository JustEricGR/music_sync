name: musicsync_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  msix: ^3.16.7

  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.1
  googleapis: ^13.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.1
  googleapis_auth: ^1.4.1
  google_sign_in_all_platforms: ^1.1.1  # Pachetul compatibil Windows, Android & iOS
  http: ^1.6.0
  youtube_explode_dart: ^3.1.0  # Pentru extragerea stream-ului audio din YouTube
  archive: ^3.6.1               # Pentru crearea fișierului .zip în memorie/disc
  file_picker: ^8.0.0           # Pentru selectarea folderului de către utilizator
  path_provider: ^2.1.2         # Pentru directoare temporare/implicite
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1
  path: ^1.9.1
  dio: ^5.11.0
  flutter_foreground_task: ^10.0.0
  flutter_local_notifications: ^18.0.0
  provider: ^6.1.5+1
  audio_session: ^0.1.21
  just_audio: ^0.9.40          # replaces audioplayers
  just_audio_background: ^0.0.1-beta.13

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/siteLogo.png" # Calea către imaginea ta salvată

flutter:
  uses-material-design: true

msix_config:
  display_name: MusicSync
  publisher_name: Eric
  identity_name: com.eric.musicsync
  capabilities: internetClient
  install_certificate: true